name: Deploy BARBERCLOUD apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub deployment environment
        required: true
        type: choice
        options: [dev, staging, prod]
      resource_group:
        description: Resource group containing the provisioned BARBERCLOUD apps
        required: true
        type: string
      entra_tenant_id:
        description: Entra tenant ID
        required: true
        type: string
        default: 094b4847-83d3-42be-b67d-c18dd6c0e29d

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm audit --audit-level=high
          npm run build
          npm run test:e2e
          mkdir -p "$RUNNER_TEMP/frontend/.next"
          cp -a .next/standalone/. "$RUNNER_TEMP/frontend/"
          cp -a .next/static "$RUNNER_TEMP/frontend/.next/static"
          if [ -d public ]; then cp -a public "$RUNNER_TEMP/frontend/public"; fi
          (cd "$RUNNER_TEMP/frontend" && zip -qr "$RUNNER_TEMP/frontend.zip" .)
      - name: Build API bundle
        run: |
          dotnet test backend/BarberCloud.sln --configuration Release
          dotnet list backend/BarberCloud.sln package --vulnerable --include-transitive
          dotnet publish backend/src/BarberCloud.Api/BarberCloud.Api.csproj \
            --configuration Release \
            --no-restore \
            --output "$RUNNER_TEMP/api"
          (cd "$RUNNER_TEMP/api" && zip -qr "$RUNNER_TEMP/api.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: barbercloud-apps
          path: |
            ${{ runner.temp }}/api.zip
            ${{ runner.temp }}/frontend.zip
          if-no-files-found: error

  deploy:
    needs: build
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: barbercloud-apps
          path: ./artifacts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.entra_tenant_id }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        with:
          inlineScript: |
            API_APP="$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, '-api')].name | [0]" --output tsv)"
            FRONTEND_APP="$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, '-frontend')].name | [0]" --output tsv)"
            if [ -z "$API_APP" ] || [ -z "$FRONTEND_APP" ]; then
              echo "BARBERCLOUD API/frontend App Service was not found in this resource group."
              exit 1
            fi
            az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$API_APP" \
              --src-path ./artifacts/api.zip --type zip
            az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP" \
              --src-path ./artifacts/frontend.zip --type zip
            API_URL="https://${API_APP}.azurewebsites.net"
            curl --fail --silent --show-error --retry 12 --retry-delay 10 \
              "$API_URL/health"
            echo "API_URL=$API_URL"
