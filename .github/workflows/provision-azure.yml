name: Provision Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, staging, prod]
      location:
        description: Azure region after residency and SKU review
        required: true
        type: string
        default: brazilsouth
      resource_group:
        description: Existing resource group
        required: true
        type: string
      sql_admin_object_id:
        description: Entra security-group object ID for SQL administration
        required: true
        type: string
      sql_admin_name:
        description: Entra security-group display name
        required: true
        type: string
      entra_tenant_id:
        description: Entra tenant ID
        required: true
        type: string
      api_audience:
        description: API application ID URI
        required: true
        type: string
      advanced_services:
        description: Provision additional chargeable services
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.entra_tenant_id }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ inputs.resource_group }}" \
              --location "${{ inputs.location }}" \
              --tags application=BARBERCLOUD environment="${{ inputs.environment }}" managedBy=Bicep
      - uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters environment="${{ inputs.environment }}" \
                location="${{ inputs.location }}" \
                sqlEntraAdminObjectId="${{ inputs.sql_admin_object_id }}" \
                sqlEntraAdminName="${{ inputs.sql_admin_name }}" \
                entraTenantId="${{ inputs.entra_tenant_id }}" \
                apiAudience="${{ inputs.api_audience }}" \
                advancedServices="${{ inputs.advanced_services }}"
            az deployment group create \
              --name "barbercloud-${{ inputs.environment }}-${{ github.run_number }}" \
              --resource-group "${{ inputs.resource_group }}" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters environment="${{ inputs.environment }}" \
                location="${{ inputs.location }}" \
                sqlEntraAdminObjectId="${{ inputs.sql_admin_object_id }}" \
                sqlEntraAdminName="${{ inputs.sql_admin_name }}" \
                entraTenantId="${{ inputs.entra_tenant_id }}" \
                apiAudience="${{ inputs.api_audience }}" \
                advancedServices="${{ inputs.advanced_services }}"
