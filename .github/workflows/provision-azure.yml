name: Provision Azure infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, staging, prod]
      location:
        description: Azure region after residency and SKU review
        required: true
        type: string
        default: brazilsouth
      resource_group:
        description: Existing resource group
        required: true
        type: string
      sql_admin_object_id:
        description: Entra security-group object ID for SQL administration
        required: true
        type: string
      sql_admin_name:
        description: Entra security-group display name
        required: true
        type: string
      entra_tenant_id:
        description: Entra tenant ID
        required: true
        type: string
        default: 094b4847-83d3-42be-b67d-c18dd6c0e29d
      api_audience:
        description: API application ID URI
        required: true
        type: string
      advanced_services:
        description: Provision additional chargeable services
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ inputs.entra_tenant_id }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        with:
          inlineScript: |
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --tags application=BARBERCLOUD environment="$DEPLOYMENT_ENVIRONMENT" managedBy=Bicep
      - uses: azure/cli@v2
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          SQL_ADMIN_OBJECT_ID: ${{ inputs.sql_admin_object_id }}
          SQL_ADMIN_NAME: ${{ inputs.sql_admin_name }}
          ENTRA_TENANT_ID: ${{ inputs.entra_tenant_id }}
          API_AUDIENCE: ${{ inputs.api_audience }}
          ADVANCED_SERVICES: ${{ inputs.advanced_services }}
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters deploymentEnvironment="$DEPLOYMENT_ENVIRONMENT" \
                location="$LOCATION" \
                sqlEntraAdminObjectId="$SQL_ADMIN_OBJECT_ID" \
                sqlEntraAdminName="$SQL_ADMIN_NAME" \
                entraTenantId="$ENTRA_TENANT_ID" \
                apiAudience="$API_AUDIENCE" \
                advancedServices="$ADVANCED_SERVICES"
            az deployment group create \
              --name "barbercloud-${DEPLOYMENT_ENVIRONMENT}-${{ github.run_number }}" \
              --resource-group "$RESOURCE_GROUP" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters deploymentEnvironment="$DEPLOYMENT_ENVIRONMENT" \
                location="$LOCATION" \
                sqlEntraAdminObjectId="$SQL_ADMIN_OBJECT_ID" \
                sqlEntraAdminName="$SQL_ADMIN_NAME" \
                entraTenantId="$ENTRA_TENANT_ID" \
                apiAudience="$API_AUDIENCE" \
                advancedServices="$ADVANCED_SERVICES"
